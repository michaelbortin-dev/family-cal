name: TimeTree to iCal

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exporter
        run: pip install timetree-exporter
      - name: Export TimeTree calendar
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
        run: |
          mkdir site
          timetree-exporter -c "${{ secrets.CALENDAR_CODE }}" -o "site/${{ secrets.FEED_NAME }}.ics"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Deploy (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
