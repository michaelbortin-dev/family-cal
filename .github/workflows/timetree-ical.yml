name: TimeTree to iCal

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exporter
        run: pip install timetree-exporter
      - name: Export TimeTree calendar
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
        run: |
          mkdir site
          timetree-exporter -c "${{ secrets.CALENDAR_CODE }}" -o "site/${{ secrets.FEED_NAME }}.ics"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
